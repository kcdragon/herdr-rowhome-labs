theme = "catppuccin"
# Open on the PR view: commits since the base branch plus uncommitted changes.
default_scope = "branch"
# Open as a split below the agent's chat.
toggle_placement = "split"
toggle_direction = "down"
# Don't open on new worktrees: rowhome.worktree-setup lays them out, and
# rowhome.reviewr-below puts reviewr under Claude once it starts.
auto_open = false
