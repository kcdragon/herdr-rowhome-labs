onboarding = false

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

[ui]
status_indicators = "symbols"

[theme]
name = "catppuccin"
auto_switch = false

# Agent sidebar layout with GitHub PR tokens from the rowhome.github-pr plugin.
# Default rows, plus a third row showing the PR for the agent's branch.
[ui.sidebar.agents]
rows = [
  ["state_icon", "machine", "workspace", "tab"],
  ["agent"],
  [
    { token = "$pr", fg = "#89b4fa", bold = true },
    { token = "$pr_state", rules = [
      { equals = "open", fg = "#a6e3a1" },
      { equals = "draft", fg = "#9399b2" },
      { equals = "merged", fg = "#cba6f7" },
      { equals = "closed", fg = "#f38ba8" },
    ] },
    { token = "$pr_checks", rules = [
      { starts_with = "✓", fg = "#a6e3a1" },
      { starts_with = "✗", fg = "#f38ba8" },
      { starts_with = "●", fg = "#f9e2af" },
    ] },
    { token = "$pr_review", rules = [
      { equals = "approved", fg = "#a6e3a1" },
      { equals = "changes", fg = "#f38ba8" },
    ] },
  ],
]

# Toggle the reviewr pane (persiyanov.reviewr) for the focused agent.
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "review diff"

# Start an agent on a prompt in a new git worktree (rowhome.new-task).
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "rowhome.new-task.new"
description = "new worktree + agent"
